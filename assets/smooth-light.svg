<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 380" width="1600" height="380" role="img" aria-label="33 milliseconds between viewfinder frames, re-timed to the sensor. After 90 seconds idle the camera switches off. 0.6 seconds from standby to recording, the volume key wakes it up."><title>33 milliseconds between viewfinder frames, re-timed to the sensor. After 90 seconds idle the camera switches off. 0.6 seconds from standby to recording, the volume key wakes it up.</title><style>text{font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', 'Segoe UI', Inter, Arial, sans-serif}</style><rect x="0" y="0" width="512" height="380" rx="40" fill="#f5f5f7"/><text x="256.0" y="168.0" font-size="96" font-weight="700" fill="#1d1d1f" text-anchor="middle" letter-spacing="-3">33 ms</text><text x="256.0" y="248.0" font-size="36" font-weight="600" fill="#1d1d1f" text-anchor="middle" letter-spacing="-0.5">Between viewfinder frames</text><text x="256.0" y="298.0" font-size="28" font-weight="400" fill="#6e6e73" text-anchor="middle" letter-spacing="0">Re-timed to the sensor</text><rect x="544" y="0" width="512" height="380" rx="40" fill="#f5f5f7"/><text x="800.0" y="168.0" font-size="96" font-weight="700" fill="#1d1d1f" text-anchor="middle" letter-spacing="-3">90 s</text><text x="800.0" y="248.0" font-size="36" font-weight="600" fill="#1d1d1f" text-anchor="middle" letter-spacing="-0.5">Idle, then standby</text><text x="800.0" y="298.0" font-size="28" font-weight="400" fill="#6e6e73" text-anchor="middle" letter-spacing="0">The camera switches off</text><rect x="1088" y="0" width="512" height="380" rx="40" fill="#f5f5f7"/><text x="1344.0" y="168.0" font-size="96" font-weight="700" fill="#1d1d1f" text-anchor="middle" letter-spacing="-3">0.6 s</text><text x="1344.0" y="248.0" font-size="36" font-weight="600" fill="#1d1d1f" text-anchor="middle" letter-spacing="-0.5">Standby to recording</text><text x="1344.0" y="298.0" font-size="28" font-weight="400" fill="#6e6e73" text-anchor="middle" letter-spacing="0">Volume key wakes it up</text></svg>
