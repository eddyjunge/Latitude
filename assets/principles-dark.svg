<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 664" width="1600" height="664" role="img" aria-label="Ready on launch: opens with the camera running, the volume buttons start and stop a take. Locked during a take: exposure, white balance and focus don't change while recording. Constant frame rate: 30p, stored as 29.97 like DJI and Sony. No processing look: no sharpening, no LUT, no AI enhancement."><title>Ready on launch: opens with the camera running, the volume buttons start and stop a take. Locked during a take: exposure, white balance and focus don't change while recording. Constant frame rate: 30p, stored as 29.97 like DJI and Sony. No processing look: no sharpening, no LUT, no AI enhancement.</title><style>text{font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', 'Segoe UI', Inter, Arial, sans-serif}</style><rect x="0" y="0" width="784" height="300" rx="32" fill="#161b22"/><circle cx="70" cy="80" r="26" fill="none" stroke="#f5f5f7" stroke-width="3.5"/><circle cx="70" cy="80" r="17" fill="#ff453a"/><text x="40.0" y="165.0" font-size="40" font-weight="700" fill="#f5f5f7" text-anchor="start" letter-spacing="-0.8">Ready on launch.</text><text x="40.0" y="210.0" font-size="25" font-weight="400" fill="#a1a1a6" text-anchor="start" letter-spacing="0">Opens with the camera running.</text><text x="40.0" y="242.0" font-size="25" font-weight="400" fill="#a1a1a6" text-anchor="start" letter-spacing="0">The volume buttons start</text><text x="40.0" y="274.0" font-size="25" font-weight="400" fill="#a1a1a6" text-anchor="start" letter-spacing="0">and stop a take.</text><rect x="816" y="0" width="784" height="300" rx="32" fill="#161b22"/><rect x="852" y="63" width="68" height="34" rx="17" fill="none" stroke="#ffd60a" stroke-width="3"/><text x="886.0" y="87.0" font-size="17" font-weight="700" fill="#ffd60a" text-anchor="middle" letter-spacing="0">AE</text><text x="856.0" y="165.0" font-size="40" font-weight="700" fill="#f5f5f7" text-anchor="start" letter-spacing="-0.8">Locked during a take.</text><text x="856.0" y="210.0" font-size="25" font-weight="400" fill="#a1a1a6" text-anchor="start" letter-spacing="0">Exposure, white balance and</text><text x="856.0" y="242.0" font-size="25" font-weight="400" fill="#a1a1a6" text-anchor="start" letter-spacing="0">focus don’t change</text><text x="856.0" y="274.0" font-size="25" font-weight="400" fill="#a1a1a6" text-anchor="start" letter-spacing="0">while recording.</text><rect x="0" y="332" width="784" height="300" rx="32" fill="#161b22"/><rect x="40" y="394" width="5" height="36" rx="1.5" fill="#f5f5f7"/><rect x="51" y="394" width="5" height="36" rx="1.5" fill="#f5f5f7"/><rect x="62" y="394" width="5" height="36" rx="1.5" fill="#f5f5f7"/><rect x="73" y="394" width="5" height="36" rx="1.5" fill="#f5f5f7"/><rect x="84" y="394" width="5" height="36" rx="1.5" fill="#f5f5f7"/><rect x="95" y="394" width="5" height="36" rx="1.5" fill="#f5f5f7"/><text x="40.0" y="497.0" font-size="40" font-weight="700" fill="#f5f5f7" text-anchor="start" letter-spacing="-0.8">Constant frame rate.</text><text x="40.0" y="542.0" font-size="25" font-weight="400" fill="#a1a1a6" text-anchor="start" letter-spacing="0">30p, stored as 29.97 like</text><text x="40.0" y="574.0" font-size="25" font-weight="400" fill="#a1a1a6" text-anchor="start" letter-spacing="0">DJI and Sony. Resolve handles</text><text x="40.0" y="606.0" font-size="25" font-weight="400" fill="#a1a1a6" text-anchor="start" letter-spacing="0">variable frame rate badly.</text><rect x="816" y="332" width="784" height="300" rx="32" fill="#161b22"/><path d="M854 430 C876 430 878 404 918 396" fill="none" stroke="#f5f5f7" stroke-width="3.5" stroke-linecap="round"/><text x="856.0" y="497.0" font-size="40" font-weight="700" fill="#f5f5f7" text-anchor="start" letter-spacing="-0.8">No processing look.</text><text x="856.0" y="542.0" font-size="25" font-weight="400" fill="#a1a1a6" text-anchor="start" letter-spacing="0">No sharpening, no LUT,</text><text x="856.0" y="574.0" font-size="25" font-weight="400" fill="#a1a1a6" text-anchor="start" letter-spacing="0">no AI enhancement.</text><text x="856.0" y="606.0" font-size="25" font-weight="400" fill="#a1a1a6" text-anchor="start" letter-spacing="0"></text></svg>
