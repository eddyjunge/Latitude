<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" width="1600" height="720" role="img" aria-label="Ready instantly. Nothing moves mid-clip. Constant frame rate. No baked-in look."><title>Ready instantly. Nothing moves mid-clip. Constant frame rate. No baked-in look.</title><style>text{font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', 'Segoe UI', Inter, Arial, sans-serif}</style><rect width="1600" height="720" fill="#ffffff"/><rect x="80.0" y="40" width="700" height="300" rx="32" fill="#f5f5f7"/><circle cx="150.0" cy="120" r="26" fill="none" stroke="#1d1d1f" stroke-width="3.5"/><circle cx="150.0" cy="120" r="17" fill="#ff3b30"/><text x="120.0" y="205" font-size="40" font-weight="700" fill="#1d1d1f" letter-spacing="-0.8">Ready instantly.</text><text x="120.0" y="250" font-size="25" fill="#6e6e73">Opens straight into a live,</text><text x="120.0" y="282" font-size="25" fill="#6e6e73">record-ready preview.</text><text x="120.0" y="314" font-size="25" fill="#6e6e73">Volume buttons start and stop.</text><rect x="820.0" y="40" width="700" height="300" rx="32" fill="#f5f5f7"/><rect x="856.0" y="103" width="68" height="34" rx="17" fill="none" stroke="#b78f00" stroke-width="3"/><text x="890.0" y="127" font-size="17" font-weight="700" fill="#b78f00" text-anchor="middle">AE</text><text x="860.0" y="205" font-size="40" font-weight="700" fill="#1d1d1f" letter-spacing="-0.8">Nothing moves mid-clip.</text><text x="860.0" y="250" font-size="25" fill="#6e6e73">Exposure, white balance and</text><text x="860.0" y="282" font-size="25" fill="#6e6e73">focus lock the moment</text><text x="860.0" y="314" font-size="25" fill="#6e6e73">you press record.</text><rect x="80.0" y="380" width="700" height="300" rx="32" fill="#f5f5f7"/><rect x="116.0" y="440" width="8" height="40" rx="3" fill="#1d1d1f"/><rect x="131.0" y="440" width="8" height="40" rx="3" fill="#1d1d1f"/><rect x="146.0" y="440" width="8" height="40" rx="3" fill="#1d1d1f"/><rect x="161.0" y="440" width="8" height="40" rx="3" fill="#1d1d1f"/><rect x="176.0" y="440" width="8" height="40" rx="3" fill="#1d1d1f"/><text x="120.0" y="545" font-size="40" font-weight="700" fill="#1d1d1f" letter-spacing="-0.8">Constant frame rate.</text><text x="120.0" y="590" font-size="25" fill="#6e6e73">24, 25, 30, 50 or 60p.</text><text x="120.0" y="622" font-size="25" fill="#6e6e73">Default 25p. Never variable,</text><text x="120.0" y="654" font-size="25" fill="#6e6e73">because Resolve hates VFR.</text><rect x="820.0" y="380" width="700" height="300" rx="32" fill="#f5f5f7"/><path d="M856.0 478 C876.0 478 880.0 458 890.0 454 C902.0 450 910.0 446 924.0 444" fill="none" stroke="#1d1d1f" stroke-width="3.5" stroke-linecap="round"/><text x="860.0" y="545" font-size="40" font-weight="700" fill="#1d1d1f" letter-spacing="-0.8">No baked-in look.</text><text x="860.0" y="590" font-size="25" fill="#6e6e73">No sharpening, no LUT,</text><text x="860.0" y="622" font-size="25" fill="#6e6e73">no AI. Just the image,</text><text x="860.0" y="654" font-size="25" fill="#6e6e73">ready for your grade.</text></svg>
