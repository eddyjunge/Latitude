<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 664" width="1600" height="664" role="img" aria-label="Ready instantly: opens straight into a record-ready preview, volume buttons start and stop. Nothing moves mid-clip: exposure, white balance and focus lock on record. Constant frame rate: 30p, stored as 29.97 like DJI and Sony do. No baked-in look: no sharpening, no LUT, no AI."><title>Ready instantly: opens straight into a record-ready preview, volume buttons start and stop. Nothing moves mid-clip: exposure, white balance and focus lock on record. Constant frame rate: 30p, stored as 29.97 like DJI and Sony do. No baked-in look: no sharpening, no LUT, no AI.</title><style>text{font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', 'Segoe UI', Inter, Arial, sans-serif}</style><rect x="0" y="0" width="784" height="300" rx="32" fill="#f5f5f7"/><circle cx="70" cy="80" r="26" fill="none" stroke="#1d1d1f" stroke-width="3.5"/><circle cx="70" cy="80" r="17" fill="#ff3b30"/><text x="40.0" y="165.0" font-size="40" font-weight="700" fill="#1d1d1f" text-anchor="start" letter-spacing="-0.8">Ready instantly.</text><text x="40.0" y="210.0" font-size="25" font-weight="400" fill="#6e6e73" text-anchor="start" letter-spacing="0">Opens straight into a live,</text><text x="40.0" y="242.0" font-size="25" font-weight="400" fill="#6e6e73" text-anchor="start" letter-spacing="0">record-ready preview.</text><text x="40.0" y="274.0" font-size="25" font-weight="400" fill="#6e6e73" text-anchor="start" letter-spacing="0">Volume buttons start and stop.</text><rect x="816" y="0" width="784" height="300" rx="32" fill="#f5f5f7"/><rect x="852" y="63" width="68" height="34" rx="17" fill="none" stroke="#b78f00" stroke-width="3"/><text x="886.0" y="87.0" font-size="17" font-weight="700" fill="#b78f00" text-anchor="middle" letter-spacing="0">AE</text><text x="856.0" y="165.0" font-size="40" font-weight="700" fill="#1d1d1f" text-anchor="start" letter-spacing="-0.8">Nothing moves mid-clip.</text><text x="856.0" y="210.0" font-size="25" font-weight="400" fill="#6e6e73" text-anchor="start" letter-spacing="0">Exposure, white balance and</text><text x="856.0" y="242.0" font-size="25" font-weight="400" fill="#6e6e73" text-anchor="start" letter-spacing="0">focus lock the moment</text><text x="856.0" y="274.0" font-size="25" font-weight="400" fill="#6e6e73" text-anchor="start" letter-spacing="0">you press record.</text><rect x="0" y="332" width="784" height="300" rx="32" fill="#f5f5f7"/><rect x="40" y="394" width="5" height="36" rx="1.5" fill="#1d1d1f"/><rect x="51" y="394" width="5" height="36" rx="1.5" fill="#1d1d1f"/><rect x="62" y="394" width="5" height="36" rx="1.5" fill="#1d1d1f"/><rect x="73" y="394" width="5" height="36" rx="1.5" fill="#1d1d1f"/><rect x="84" y="394" width="5" height="36" rx="1.5" fill="#1d1d1f"/><rect x="95" y="394" width="5" height="36" rx="1.5" fill="#1d1d1f"/><text x="40.0" y="497.0" font-size="40" font-weight="700" fill="#1d1d1f" text-anchor="start" letter-spacing="-0.8">Constant frame rate.</text><text x="40.0" y="542.0" font-size="25" font-weight="400" fill="#6e6e73" text-anchor="start" letter-spacing="0">30p, stored as 29.97 like DJI</text><text x="40.0" y="574.0" font-size="25" font-weight="400" fill="#6e6e73" text-anchor="start" letter-spacing="0">and Sony do. Never variable,</text><text x="40.0" y="606.0" font-size="25" font-weight="400" fill="#6e6e73" text-anchor="start" letter-spacing="0">because Resolve hates VFR.</text><rect x="816" y="332" width="784" height="300" rx="32" fill="#f5f5f7"/><path d="M854 430 C876 430 878 404 918 396" fill="none" stroke="#1d1d1f" stroke-width="3.5" stroke-linecap="round"/><text x="856.0" y="497.0" font-size="40" font-weight="700" fill="#1d1d1f" text-anchor="start" letter-spacing="-0.8">No baked-in look.</text><text x="856.0" y="542.0" font-size="25" font-weight="400" fill="#6e6e73" text-anchor="start" letter-spacing="0">No sharpening, no LUT,</text><text x="856.0" y="574.0" font-size="25" font-weight="400" fill="#6e6e73" text-anchor="start" letter-spacing="0">no AI. Just the image,</text><text x="856.0" y="606.0" font-size="25" font-weight="400" fill="#6e6e73" text-anchor="start" letter-spacing="0">ready for your grade.</text></svg>
